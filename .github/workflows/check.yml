name: Flake checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: flake-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-14
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Formatting
        run: make fmt-check
      - name: Fast evaluation
        run: make eval-check
      - name: Native checks and host closures
        run: nix flake check --show-trace path:.
