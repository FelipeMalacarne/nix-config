name: Flake checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: flake-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-14
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Match the upstream Nix used by the hosts.
      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      - name: Formatting
        run: make fmt-check
      # No separate `make eval-check`: on a fresh store `--no-build` does not
      # write the source copies that evaluation later imports, so it fails.
      - name: Native checks and host closures
        run: nix flake check --show-trace .
