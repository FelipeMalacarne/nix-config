[audio]
enable_overdrive = true
enable_sounds = false

[bar.default]
border_width = 0
capsule = true
center = [
    "weather",
    "clock",
    "group:g1",
]
contact_shadow = true
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "control-center",
    "session",
]
margin_edge = 5
margin_ends = 10
padding = 2
position = "top"
start = [
    "launcher",
    "workspaces",
    "media",
]
widget_spacing = 8

[bar.default.dead_zone.actions]
right = "panel-toggle control-center"

[[bar.default.capsule_group]]
fill = "surface_variant"
id = "g1"
members = [
    "ram",
    "cpu",
    "temp",
]
opacity = 1.0
padding = 6.0

[brightness]
enable_ddcutil = true

[control_center]
hidden_tabs = [
    "monitor",
]
shortcuts = [
    { type = "wifi" },
    { type = "bluetooth" },
    { type = "wallpaper" },
    { type = "notification" },
    { type = "power_profile" },
    { type = "caffeine" },
]

[control_center.calendar]
show_events_card = true

[desktop_widgets]
enabled = true

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[dock]
active_monitor_only = true
auto_hide = true
enabled = true
margin_edge = 8
position = "bottom"
reserve_space = false
show_dots = true

[location]
address = "Erechim, Brasil"
auto_locate = false

[lockscreen]
blur_intensity = 0
enabled = true
lock_before_suspend = true
tint_intensity = 0
transition = []

[lockscreen_widgets]
enabled = true

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[notification]
enable_daemon = true
keep_dismissed_in_history = false
layer = "overlay"
position = "top_right"

[osd]
hide_delay_ms = 2000
position = "top_right"

[osd.kinds]
keyboard_layout = true
media = false

[plugins]
auto_update = "none"
enabled = [
    "noctalia/screen_recorder",
    "noctalia/bitwarden",
]

[shell]
app_icon_colorize = false
clipboard_auto_paste = "off"
clipboard_enabled = false
screen_time_enabled = true
settings_show_advanced = true
setup_wizard_enabled = false
telemetry_enabled = false

[shell.launcher]
app_grid = false
auto_paste = "off"
categories = true
sort_by_usage = true

[shell.launcher.providers.panels]
global = true

[shell.launcher.providers.session]
global = true

[shell.launcher.providers.windows]
global = true

[shell.panel]
borders = false
control_center_placement = "floating"
launcher_placement = "floating"
launcher_position = "center"
open_near_click_control_center = true
session_placement = "floating"
session_position = "center"

[[shell.session.actions]]
action = "lock"
countdown_seconds = 10
shortcut = "1"

[[shell.session.actions]]
action = "suspend"
countdown_seconds = 10
shortcut = "2"

[[shell.session.actions]]
action = "command"
command = "systemctl hibernate"
countdown_seconds = 10
label = "Hibernate"
shortcut = "3"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 10
shortcut = "4"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 10
shortcut = "5"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 10
shortcut = "6"

[[shell.session.actions]]
action = "command"
command = "systemctl reboot --firmware-setup"
countdown_seconds = 10
label = "Reboot to UEFI"
shortcut = "7"

[system.monitor]
gpu_poll_seconds = 0

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Macchiato Lavender"
custom_palette = "stylix"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-tonal-spot"

[wallpaper]
edge_smoothness = 0.05
enabled = true
fill_color = "#000000"
transition = [
    "fade",
    "disc",
    "stripes",
    "wipe",
    "honeycomb",
]
transition_duration = 1500
transition_on_startup = true

[weather]
effects = true
enabled = true
unit = "metric"

[widget.active_window]
display = "icon_and_text"
max_length = 145
show_empty_label = false
title_scroll = "on_hover"

[widget.battery]
display_mode = "graphic"
hide_when_plugged = false
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
anchor = true
format = "%H:%M %a, %b %d"
tooltip_format = "%H:%M %a, %b %d"
vertical_format = "%H %M - %d %m"

[widget.control-center]
glyph = "noctalia"

[widget.cpu]
stat = "cpu_usage"
type = "sysmon"
visualization = "none"

[widget.cpu_temp]
stat = "cpu_temp"
type = "sysmon"
visualization = "none"

[widget.launcher]
glyph = "rocket"

[widget.media]
artist_first = true
capsule = true
hide_when_idle = false
hide_when_no_media = true
max_length = 145
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = false

[widget.ram]
stat = "ram_used"
type = "sysmon"
visualization = "none"

[widget.sysmon]
capsule = true
show_value = false
stat = "gpu_vram"

[widget.temp]
show_value = false

[widget.tray]
drawer = true
hide_passive = false

[widget.volume]
show_label = false

[widget.volume.actions]
middle = "exec pwvucontrol || pavucontrol"

[widget.weather]
capsule = true

[widget.workspaces]
empty_color = "secondary"
focused_color = "primary"
font_weight = 700
hide_when_empty = false
label_source = "id"
labels_only_when_occupied = true
max_label_chars = 2
occupied_color = "secondary"
pill_scale = 0.6
show_all_outputs = false
